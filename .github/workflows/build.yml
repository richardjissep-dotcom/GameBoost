name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Organizar pastas
        run: |
          mkdir -p app/src/main/java/com/gameboost
          mv app-build.gradle.kts app/build.gradle.kts
          mv AndroidManifest.xml app/src/main/
          mv Core.kt GameService.kt Overlay.kt MainActivity.kt app/src/main/java/com/gameboost/
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: GameBoost-apk, path: app/build/outputs/apk/debug/app-debug.apk }
